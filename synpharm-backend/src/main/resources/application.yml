spring:
  application:
    name: synpharm-backend
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/synpharm?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
#      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms

  mail:
    host: smtp.qq.com
    port: 465
    username: ${QQ_EMAIL:3086499874@qq.com}
    password: ${QQ_EMAIL_AUTH_CODE:cphjbrgtndkwdhde}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.synpharm.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 安全关键：必须通过环境变量提供 ≥32 字节强随机密钥；留空则启动即失败（fail-fast）
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${SERVER_PORT:8080}

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.synpharm: debug
    com.baomidou.mybatisplus: info

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  result-dir: ${FILE_RESULT_DIR:./results}

fastapi:
  base-url: ${FASTAPI_URL:http://localhost:8000}
  # 调用算法引擎的 API Key（与 FastAPI 的 API_KEYS 对应；留空则不携带）
  api-key: ${FASTAPI_API_KEY:}
  timeout-single: ${FASTAPI_TIMEOUT_SINGLE:30000}
  timeout-batch: ${FASTAPI_TIMEOUT_BATCH:60000}
  # 算法引擎健康检查（GET /health/）：超时、有限重试次数、熔断阈值与开启时长
  health-timeout: ${FASTAPI_HEALTH_TIMEOUT:5000}
  health-retries: ${FASTAPI_HEALTH_RETRIES:2}
  health-breaker-threshold: ${FASTAPI_HEALTH_BREAKER_THRESHOLD:5}
  health-breaker-open-ms: ${FASTAPI_HEALTH_BREAKER_OPEN_MS:30000}

# 输入解析（修复方案 5.4）：UniProt / RCSB PDB 外部数据源与缓存
prediction:
  resolver:
    uniprot-base-url: ${UNIPROT_BASE_URL:https://rest.uniprot.org}
    rcsb-base-url: ${RCSB_BASE_URL:https://data.rcsb.org}
    connect-timeout-ms: ${RESOLVER_CONNECT_TIMEOUT:3000}
    read-timeout-ms: ${RESOLVER_READ_TIMEOUT:5000}
    cache-ttl-hours: ${RESOLVER_CACHE_TTL_HOURS:24}
    negative-cache-ttl-minutes: ${RESOLVER_NEGATIVE_CACHE_TTL_MINUTES:10}

app:
  name: SynPharm
